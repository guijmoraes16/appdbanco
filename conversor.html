   <main role="main" class="container" style="margin-top: 100px;">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm" style="border-radius: 25px; overflow: hidden; border: none;">
        <div class="card-body p-4">
          <h4 class="card-title text-center mb-4">Conversor de Moedas</h4>
          
          <div class="form-group">
            <label for="amount" class="small">Valor:</label>
            <input type="number" class="form-control form-control-sm" id="amount" placeholder="0.00" style="border-radius: 10px;">
          </div>

          <div class="row">
            <div class="col-6">
              <div class="form-group">
                <label for="fromCurrency" class="small">De:</label>
                <select class="form-control form-control-sm" id="fromCurrency" style="border-radius: 10px;">
                  <option value="BRL">BRL (Real)</option>
                  <option value="USD">USD (Dólar)</option>
                  <option value="EUR">EUR (Euro)</option>
                  <option value="GBP">GBP (Libra)</option>
                  <option value="JPY">JPY (Iene)</option>
                  <option value="RUB">RUB (Rublo)</option>
                </select>
              </div>
            </div>
            <div class="col-6">
              <div class="form-group">
                <label for="toCurrency" class="small">Para:</label>
                <select class="form-control form-control-sm" id="toCurrency" style="border-radius: 10px;">
                  <option value="USD" selected>USD (Dólar)</option>
                  <option value="BRL">BRL (Real)</option>
                  <option value="EUR">EUR (Euro)</option>
                  <option value="GBP">GBP (Libra)</option>
                  <option value="JPY">JPY (Iene)</option>
                  <option value="RUB">RUB (Rublo)</option>
                </select>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-primary btn-sm btn-block" onclick="converter()" style="border-radius: 10px; font-weight: bold;">
            Converter Agora
          </button>

          <div class="mt-3 text-center">
           
            <div id="result" class="alert alert-success py-2 small" style="border-radius: 10px;">
              Aguardando valor...
            </div>
          </div>
        </div>
